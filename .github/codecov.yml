# Codecov reports; it does not gate.
#
# The coverage gate of AGENTS.md §3.1 is the ratchet in ci.yml: one number,
# committed to this repository as .coverage-floor, that a pull request has to
# move deliberately and may never move down. A second opinion computed by a
# third party from an upload that may or may not have arrived must not be
# able to block a merge — hence informational statuses rather than failing
# ones.
#
# What is uploaded is the profile the unit-test job already produces:
# statement coverage of ./internal/..., the same scope the floor governs.

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: reach, diff, flags
  require_changes: true
