# Probavi release — runs when a v* tag is pushed. Tags are cut only from
# main, which every CI gate already protects; this workflow builds the
# artifacts reproducibly (AGENTS.md §3.3) and drafts the GitHub release for
# the maintainer to review and publish. Third-party actions are pinned to
# commit SHAs (supply-chain rule, §3.3). What this workflow publishes it
# publishes through `gh`, never through git, so the checkouts drop the token
# they were handed instead of leaving it in .git/config.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # Sigstore build provenance: keyless, OIDC, nothing long-lived to guard.
  # It is why there is no packaging GPG key — signing .deb files would be
  # security theatre for most users (dpkg does not verify them by default)
  # in exchange for a second key to protect forever, in a project whose
  # trust proposition is key handling.
  id-token: write
  attestations: write

jobs:
  release:
    name: Build artifacts and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: sanity build
        run: go build ./... && go vet ./...

      - name: build reproducible artifacts
        # CGO off, -trimpath, and an empty build id make each binary depend
        # only on the source tree and the Go toolchain; the tar/gzip flags
        # make the archives deterministic too. Anyone can rebuild and
        # compare against SHA256SUMS — the instructions ship in the
        # release notes.
        #
        # One archive per binary, never a bundle. The core resolves
        # probavi-adapter-<name> on PATH (AGENTS.md §2.1), so an adapter is
        # a separately installable thing, and packaging follows the same
        # split. It also keeps AGENTS.md §6 open: if adapters ever move to
        # their own repositories, these artifact names do not change.
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          # pack <binary> <go-package> <ldflags> <extra doc>...
          # goos/goarch come from the platform loop below.
          pack() {
            bin="$1"; pkg="$2"; ldflags="$3"; shift 3
            name="${bin}_${VERSION}_${goos}_${goarch}"
            outdir="dist/${name}"
            mkdir -p "${outdir}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags "${ldflags}" -o "${outdir}/${bin}" "${pkg}"
            cp LICENSE "$@" "${outdir}/"
            tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' \
              -cf - -C "${outdir}" . | gzip -n -9 > "dist/${name}.tar.gz"
            rm -r "${outdir}"
          }

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"

            pack probavi ./cmd/probavi \
              "-s -w -buildid= -X main.version=${VERSION}" \
              README.md CHANGELOG.md

            # Adapters deliberately get no -X main.version. Their version is
            # the adapterVersion const they report through the protocol,
            # which lands in every signed evidence record as adapter.version
            # and moves independently of this tag; a second, disagreeing
            # number on the same binary would be worse than none. The symbol
            # does not exist either, and -X on a missing symbol is silent.
            #
            # The glob is the registry: every adapter directory ships, and
            # internal/docs holds that set to docs/capabilities.json so an
            # undeclared binary cannot slip into a release.
            for dir in adapters/*/; do
              id="${dir#adapters/}"
              id="${id%/}"
              pack "probavi-adapter-${id}" "./${dir%/}" \
                "-s -w -buildid=" "${dir}README.md"
            done
          done

      - name: build Linux packages
        # .deb, .rpm and .apk for both architectures, from the same
        # binaries the archives carry. Arch and Gentoo build from source
        # and get rendered recipes instead (below).
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # See ci.yml: pinned to the newest nfpm the go.mod toolchain builds.
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          for goarch in amd64 arm64; do
            rm -rf dist/pkgroot && mkdir -p dist/pkgroot
            CGO_ENABLED=0 GOOS=linux GOARCH="${goarch}" \
              go build -trimpath -ldflags "-s -w -buildid= -X main.version=${VERSION}" \
              -o dist/pkgroot/probavi ./cmd/probavi
            for dir in adapters/*/; do
              id="${dir#adapters/}"; id="${id%/}"
              CGO_ENABLED=0 GOOS=linux GOARCH="${goarch}" \
                go build -trimpath -ldflags "-s -w -buildid=" \
                -o "dist/pkgroot/probavi-adapter-${id}" "./${dir%/}"
            done
            VERSION="${VERSION}" ARCH="${goarch}" packaging/build-packages.sh dist/pkgroot dist
          done
          rm -rf dist/pkgroot

      - name: render the source-built recipes
        # Arch and Gentoo compile from the GitHub source tarball, so both
        # recipes need that tarball's checksum. They are attached to the
        # release rather than pushed: the AUR wants an unscopeable SSH key,
        # and the overlay has no repository yet (docs/packaging.md).
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          curl -fsSLo source.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          export SOURCE_SHA256="$(sha256sum source.tar.gz | cut -d' ' -f1)"

          # Both package managers refuse a version containing a hyphen, so
          # a pre-release tag needs their own spelling: makepkg rejects any
          # hyphen in pkgver, and portage's grammar wants _rc1 rather than
          # -rc.1. Only the version string changes; SRC_URI keeps the real
          # tag, which is what the tarball is published under. nfpm handles
          # this itself, emitting ~rc.1 for deb and rpm — the form that
          # sorts *before* the final release, which is what a pre-release
          # must do. A final version passes through both untouched.
          arch_ver="$(printf '%s' "${VERSION}" | sed 's/-//; s/\([a-z]\)\./\1/')"
          gentoo_ver="$(printf '%s' "${VERSION}" | sed 's/-/_/; s/\(_[a-z]*\)\./\1/')"
          echo "recipe versions: arch=${arch_ver} gentoo=${gentoo_ver}"

          PKGVER="${arch_ver}" TAG="${GITHUB_REF_NAME}" SRCVER="${VERSION}" \
            envsubst '${PKGVER} ${SOURCE_SHA256} ${TAG} ${SRCVER}' \
            < packaging/aur/PKGBUILD.tmpl > dist/PKGBUILD
          TAG="${GITHUB_REF_NAME}" SRCVER="${VERSION}" \
            envsubst '${TAG} ${SRCVER}' \
            < packaging/gentoo/app-backup/probavi/probavi-9999.ebuild.tmpl \
            > "dist/probavi-${gentoo_ver}.ebuild"
          rm -f source.tar.gz

      - name: checksum every artifact
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- *.tar.gz *.deb *.rpm *.apk PKGBUILD ./*.ebuild > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: render the Homebrew formulae
        # Checksums come from the SHA256SUMS just written, never
        # recomputed: a formula can then only pin what this release
        # actually published. A wrong sha256 fails at `brew install`, on
        # the user's machine.
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}" packaging/homebrew/render.sh dist/SHA256SUMS dist/Formula
          ls -1 dist/Formula

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk

      - name: draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for everything in ${GITHUB_REF_NAME}."
            echo
            echo "## What to download"
            echo
            echo "One archive per binary, for Linux and macOS on amd64 and arm64."
            echo "\`probavi\` is the orchestrator: it resolves \`probavi-adapter-<engine>\`"
            echo "on \`PATH\`, so take the core **plus an adapter for each engine you drill**."
            echo
            jq -r '.adapters[] | "- `probavi-adapter-\(.id)` — \(.name), adapter version `\(.adapter_version)`"' \
              docs/capabilities.json
            echo
            echo "The adapter version above is what that adapter reports through the"
            echo "protocol and what every signed evidence record carries as"
            echo "\`adapter.version\`. It moves independently of this release tag —"
            echo "the compatibility contract between core and adapter is the adapter"
            echo "protocol version, negotiated at handshake, not either version number."
            echo
            echo "## Verify the download"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
            echo
            echo "Every archive and package also carries a sigstore build-provenance"
            echo "attestation, which needs no key from anyone:"
            echo
            echo '```sh'
            echo "gh attestation verify probavi_${VERSION}_linux_amd64.tar.gz --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "## Linux packages"
            echo
            echo "\\`.deb\\`, \\`.rpm\\` and \\`.apk\\` for amd64 and arm64, one per binary."
            echo "There is no Probavi apt or yum repository on purpose: hosting one means"
            echo "a second long-lived signing key to guard, in a project whose trust"
            echo "proposition is key handling. Install the file directly, e.g."
            echo
            echo '```sh'
            echo "sudo apt install ./probavi_${VERSION}_amd64.deb ./probavi-adapter-postgres_${VERSION}_amd64.deb"
            echo '```'
            echo
            echo "\\`PKGBUILD\\` (Arch) and \\`probavi-${VERSION}.ebuild\\` (Gentoo) build from"
            echo "source and are attached here too. See"
            echo "[docs/packaging.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/packaging.md)."
            echo
            echo "## macOS"
            echo
            echo "Use the \`darwin\` archives above; a directly downloaded file is"
            echo "quarantined by macOS, so clear it with"
            echo "\`xattr -d com.apple.quarantine probavi\`."
            echo
            echo "The \`.rb\` files attached here are ready-made Homebrew formulae, with"
            echo "their checksums taken from this release's SHA256SUMS. They name no tap,"
            echo "so dropping them into one of your own gives a \`brew install\` with no"
            echo "quarantine step — there is no hosted Probavi tap. See"
            echo "[docs/packaging.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/packaging.md)."
            echo
            echo "## Reproduce the binaries"
            echo
            echo "Built with \`$(go version | cut -d' ' -f3)\` (pinned by go.mod). To reproduce a binary bit for bit:"
            echo
            echo '```sh'
            echo "git checkout ${GITHUB_REF_NAME}"
            echo
            echo "# the core"
            echo "CGO_ENABLED=0 GOOS=<os> GOARCH=<arch> \\"
            echo "  go build -trimpath -ldflags \"-s -w -buildid= -X main.version=${VERSION}\" \\"
            echo "  -o probavi ./cmd/probavi"
            echo
            echo "# an adapter — no -X, and -o is required because go build would"
            echo "# otherwise name the binary after its directory"
            echo "CGO_ENABLED=0 GOOS=<os> GOARCH=<arch> \\"
            echo "  go build -trimpath -ldflags \"-s -w -buildid=\" \\"
            echo "  -o probavi-adapter-postgres ./adapters/postgres"
            echo '```'
            echo
            echo "Each result matches the binary inside the corresponding archive."
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.apk \
            dist/PKGBUILD dist/*.ebuild dist/Formula/*.rb dist/SHA256SUMS \
            --draft --verify-tag --title "probavi ${GITHUB_REF_NAME}" --notes-file notes.md

  image:
    name: Publish container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The draft release must exist before its notes can gain the digest,
    # and a failed artifact build should not leave an image published
    # against a release nobody can download.
    needs: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # QEMU so one amd64 runner can also produce the arm64 layer, and the
      # container driver because the default builder cannot do multi-arch.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GHCR authenticates with the built-in token, so publishing the
          # image adds no long-lived secret to this repository.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: the version this tag names
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The version, not the git tag. Passing ref_name stamped the
          # binary inside the image "v0.3.0" while the archives and
          # packages of the same release stamped "0.3.0" — and that stamp
          # is what a drill signs into every record as env.probavi_version,
          # so one release would have produced two spellings of itself in
          # an audit trail.
          build-args: VERSION=${{ steps.version.outputs.value }}
          # Without the leading "v", matching the release archives and
          # what docs/docker.md tells people to pull. github.ref_name is
          # the tag, so using it raw published probavi:v0.3.0 while every
          # document said probavi:0.3.0 — a 404 for every reader.
          #
          # No :latest either. A drill's evidence should name a version
          # somebody can pull again, and a floating tag makes that
          # impossible.
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
          provenance: true
          sbom: true

      - name: record the digest in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          # Append to the notes the release job wrote; --notes-file
          # replaces them wholesale, so read them back first.
          gh release view "${GITHUB_REF_NAME}" --json body -q .body > notes.md
          {
            echo
            echo "## Container image"
            echo
            echo '```sh'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
            echo '```'
            echo
            echo "Immutable digest — pin this in anything automated:"
            echo
            echo '```'
            echo "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
            echo '```'
            echo
            echo "The image carries the core and every in-repo adapter; it supports the"
            echo "\`docker\` and \`remotehost\` sandbox providers. Read"
            echo "[docs/docker.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/docker.md)"
            echo "first: giving a containerised Probavi a daemon means either mounting the"
            echo "host socket — root-equivalent access to that host — or pointing"
            echo "\`DOCKER_HOST\` at a remote one."
          } >> notes.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
