# Probavi CI — the quality gates of AGENTS.md §3.1, mechanized.
# Every gate blocks merge; gates are never lowered to make a change pass.
# Third-party actions are pinned to commit SHAs (supply-chain rule, §3.3);
# Go tools are installed via `go install` with pinned versions so the module
# proxy + checksum database verify them (no curl|sh). No job here writes to
# the repository, so every checkout drops the token it was handed instead of
# leaving it in .git/config for the rest of the run to reach.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "files not gofmt-clean:"; echo "$out"; exit 1
          fi
      - name: go.mod / go.sum tidy
        run: go mod tidy -diff
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint run --timeout 5m
      - name: spec/evidence module (separate module, same gates)
        # spec/evidence is a separate Go module so that the independent
        # verifier physically cannot import internal/evidence. That also
        # puts it outside the root module's ./... — it needs its own
        # invocation of every gate, or it would silently go unchecked.
        working-directory: spec/evidence
        run: |
          go mod tidy -diff
          golangci-lint run --timeout 5m ./...

  test:
    name: Unit tests (race, coverage ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: test with race detector and coverage
        run: go test -race -coverprofile=cover.out -coverpkg=./internal/... ./...
      - name: coverage ratchet
        # .coverage-floor holds the committed minimum for ./internal/...
        # coverage. PRs that raise coverage may raise the floor; lowering it
        # is never acceptable — that is the "coverage must not decrease"
        # gate of AGENTS.md §3.1.
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/, "", $3); print $3}')
          floor=$(cat .coverage-floor)
          echo "internal coverage: ${total}% (committed floor: ${floor}%)"
          if ! awk -v t="$total" -v f="$floor" 'BEGIN {exit (t + 0 >= f + 0) ? 0 : 1}'; then
            echo "::error::coverage ${total}% fell below the committed floor ${floor}% — add tests; never lower the floor"
            exit 1
          fi
      - name: report the profile to Codecov
        # Reporting only. The gate is the ratchet above, against a floor
        # committed to this repository; a number a third party computes may
        # not decide whether a change merges (.github/codecov.yml pins that
        # down on their side too). Runs after the ratchet, so a report is
        # never published for a run that already failed the standard.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: cover.out
          token: ${{ secrets.CODECOV_TOKEN }}
          # An upload that cannot reach Codecov is not a reason to fail a
          # gate that has already measured the number it was asked for.
          fail_ci_if_error: false
      - name: spec/evidence — independent verifier
        # The whole value of this module is that it agrees with the core
        # about the published example logs without sharing a line of code
        # with it. It is a trust-core component, so it carries the near-100%
        # bar of AGENTS.md §3.1 rather than the repository-wide floor.
        working-directory: spec/evidence
        run: |
          go build ./...
          go test -race -coverprofile=cover.out .
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/, "", $3); print $3}')
          echo "spec/evidence coverage: ${total}%"
          if ! awk -v t="$total" 'BEGIN {exit (t + 0 >= 100) ? 0 : 1}'; then
            echo "::error::spec/evidence is the independent verifier — it holds at 100% statement coverage"
            exit 1
          fi
          go test -race ./cmd/...

  integration:
    name: Integration tests (real Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: set up kind cluster (k8s sandbox provider)
        # kind is installed like every other Go tool — pinned version,
        # verified by the module checksum database. kubectl ships with the
        # runner image. postgres:16 is preloaded into the node so the k8s
        # tests never pull through the cluster.
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          kind create cluster --name probavi-it --wait 120s
          docker pull -q postgres:16
          kind load docker-image postgres:16 --name probavi-it
      - name: set up ssh loopback (remote docker over ssh)
        # The remote-docker test drives the daemon through the docker CLI's
        # native SSH transport, looped back to this runner: key-based ssh to
        # 127.0.0.1, host key pinned by ssh-keyscan — the provider cannot
        # tell it from a genuinely remote host.
        run: |
          sudo systemctl start ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan -H 127.0.0.1 >> ~/.ssh/known_hosts 2>/dev/null
          ssh 127.0.0.1 docker version --format '{{.Server.Version}}'
      - name: set up remotehost target (bare-host sandbox provider)
        # The bare-host provider drives a dedicated drill host over plain
        # ssh + systemd — looped back to this runner. The polkit rule below
        # is exactly the one the README ships for the dedicated drill user;
        # here that user is the runner itself. The probe at the end proves
        # the whole chain (ssh → polkit → transient unit) before the tests.
        run: |
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /var/lib/probavi-drills
          sudo tee /etc/polkit-1/rules.d/50-probavi-drill.rules >/dev/null <<EOF
          polkit.addRule(function(action, subject) {
              if (action.id == "org.freedesktop.systemd1.manage-units" &&
                  subject.user == "$(id -un)") {
                  return polkit.Result.YES;
              }
          });
          EOF
          sudo systemctl restart polkit
          ssh 127.0.0.1 systemd-run --quiet --collect --wait --pipe --slice=probavi-ci-probe.slice true
          ssh 127.0.0.1 systemctl stop probavi-ci-probe.slice
      - name: integration tests
        # PROBAVI_IT_K8S=1 / PROBAVI_IT_SSH=1 / PROBAVI_IT_REMOTEHOST=1:
        # with the setup steps above, an unreachable cluster or ssh target
        # is a hard failure — these tests must never silently skip the axes
        # this job exists to prove.
        #
        # Everything except adapters/. Those run in version-matrix.yml,
        # one job per adapter, which is the same work on more runners:
        # measured on this job before the split, five engine suites cost
        # 611 s of its 649 s and did not overlap — a four-vCPU runner
        # driving five databases under the race detector saturates, so the
        # wall clock was the sum. Splitting them off takes the everyday
        # gate from ~13 minutes to under five, and removes the duplication
        # where a manifest change ran every baseline twice.
        run: |
          PROBAVI_IT_K8S=1 PROBAVI_IT_SSH=1 PROBAVI_IT_REMOTEHOST=1 \
            go test -race -tags integration $(go list ./... | grep -v '/adapters/')

  capabilities:
    name: Capabilities manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: regenerate docs/capabilities.json
        # Exactly the command a developer runs, so the //go:generate
        # directive is exercised too, not only the tool behind it.
        run: go generate ./...
      - name: fail on drift
        # docs/capabilities.json is the public statement of what Probavi
        # can do, read downstream through a submodule. A capability that
        # ships without regenerating it would publish a stale claim, so a
        # dirty tree here blocks merge like any other gate (AGENTS.md §5.8).
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::docs/capabilities.json is stale — run 'go generate ./...' and commit the result (AGENTS.md §5.8)"
            git --no-pager diff
            git status --porcelain
            exit 1
          fi

  vulncheck:
    name: Known-vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The scanner runs on the latest stable toolchain, not the module
          # minimum from go.mod. This is not about building the tool: the
          # standard library is scanned at the toolchain's own version, so
          # a job pinned to the module minimum would flag stdlib advisories
          # that the current patch release already fixed — and blame us.
          go-version: stable
          check-latest: true
      - name: govulncheck
        # The scanner is a tool dependency in go.mod: pinned by version,
        # verified by the checksum database, and kept current by the weekly
        # Dependabot gomod run — pinned and current are not in tension.
        # The vulnerability *data* is fetched live regardless of the tool's
        # version. spec/evidence is a separate module (its isolation is the
        # point), so it is scanned through -C rather than its own tool
        # directive, which would put a dependency into the one module whose
        # value is having none.
        run: |
          go tool govulncheck ./...
          go tool govulncheck -C spec/evidence ./...

  adapter-version:
    name: Adapter version bump
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A pull-request gate by construction: "the source changed" has no
    # meaning without a base to measure against. The label is the escape
    # hatch for a change that provably cannot alter behaviour — it sits on
    # the pull request where a reviewer sees it, rather than hiding in a
    # commit message.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'adapter-version-exempt')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The gate reads the base commit and the files at it, so the
          # default single-commit checkout is not enough.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: adapterVersion moved with the source
        # An adapter reports adapterVersion through the protocol and the
        # core signs it into every evidence record as adapter.version. Two
        # builds publishing the same version leave an auditor unable to
        # tell them apart, so changing one without the other blocks merge.
        run: go run ./internal/tools/adapterversion -base "${{ github.event.pull_request.base.sha }}"

  packages:
    name: Linux packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: build the packages
        # Pinned by module version, so the proxy and checksum database
        # verify the tool (no curl|sh). Exactly the script the release
        # runs, so what is proven here is what ships.
        run: |
          set -euo pipefail
          # Pinned to the newest nfpm whose own go directive the toolchain
          # in go.mod can still build: v2.47.0 requires Go 1.26.4, and
          # setup-go pins GOTOOLCHAIN=local on purpose. Bump this when the
          # project's Go version moves, not before.
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          mkdir -p dist/pkgroot
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -buildid= -X main.version=ci" \
            -o dist/pkgroot/probavi ./cmd/probavi
          for dir in adapters/*/; do
            id="${dir#adapters/}"; id="${id%/}"
            CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -buildid=" \
              -o "dist/pkgroot/probavi-adapter-${id}" "./${dir%/}"
          done
          VERSION=0.0.0 ARCH=amd64 packaging/build-packages.sh dist/pkgroot dist/pkgs
          ls -1 dist/pkgs

      # Building a package proves nothing about whether it works. The
      # failure this exists to catch installs cleanly and leaves the
      # adapter where the core's PATH lookup will never find it, so every
      # family gets installed and asked to resolve an adapter for real.
      - name: install and run on Debian
        run: |
          docker run --rm -v "$PWD/dist/pkgs:/pkgs:ro" debian:stable-slim sh -eus <<'SH'
            apt-get update -qq
            apt-get install -y -qq /pkgs/probavi_0.0.0_amd64.deb /pkgs/probavi-adapter-postgres_0.0.0_amd64.deb
            command -v probavi
            command -v probavi-adapter-postgres
            probavi adapter probe postgres | grep -q '"name":"postgres"'
            apt-get remove -y -qq probavi-adapter-postgres probavi
            test ! -e /usr/bin/probavi
          SH

      - name: install and run on Fedora
        run: |
          docker run --rm -v "$PWD/dist/pkgs:/pkgs:ro" fedora:latest sh -eus <<'SH'
            dnf install -y -q /pkgs/probavi-0.0.0-1.x86_64.rpm /pkgs/probavi-adapter-postgres-0.0.0-1.x86_64.rpm
            probavi adapter probe postgres | grep -q '"name":"postgres"'
            rpm -q --requires probavi-adapter-postgres | grep -qx probavi
            dnf remove -y -q probavi-adapter-postgres probavi
          SH

      # The formulae are Ruby, generated at release time from checksums
      # nobody reviews by hand. A syntax error there surfaces on a user's
      # Mac during `brew install`, long after the release is published.
      - name: render and syntax-check the Homebrew formulae
        run: |
          set -euo pipefail
          mkdir -p dist/fake
          for name in probavi $(for d in adapters/*/; do d="${d#adapters/}"; echo "probavi-adapter-${d%/}"; done); do
            for arch in arm64 amd64; do
              echo "placeholder" > "dist/fake/${name}_0.0.0_darwin_${arch}.tar.gz"
            done
          done
          (cd dist/fake && sha256sum -- *.tar.gz > SHA256SUMS)
          VERSION=0.0.0 packaging/homebrew/render.sh dist/fake/SHA256SUMS dist/Formula
          for f in dist/Formula/*.rb; do ruby -c "$f"; done
          # A checksum the release did not publish must stop the render,
          # never yield a formula pinning an empty string.
          grep -v 'probavi_0.0.0_darwin_arm64' dist/fake/SHA256SUMS > dist/fake/SHORT
          if VERSION=0.0.0 packaging/homebrew/render.sh dist/fake/SHORT dist/Bad 2>/dev/null; then
            echo "::error::render.sh accepted a SHA256SUMS with a missing entry"
            exit 1
          fi

      - name: install and run on Alpine
        run: |
          docker run --rm -v "$PWD/dist/pkgs:/pkgs:ro" alpine:3.22 sh -eus <<'SH'
            apk add --no-cache --allow-untrusted /pkgs/probavi_0.0.0_x86_64.apk /pkgs/probavi-adapter-postgres_0.0.0_x86_64.apk
            probavi adapter probe postgres | grep -q '"name":"postgres"'
            apk del probavi-adapter-postgres probavi
            test ! -e /usr/bin/probavi
          SH
