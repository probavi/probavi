# Probavi version matrix — restores from every engine version the adapter
# manifests claim, not only the baseline the everyday CI run exercises.
#
# docs/capabilities.json states which engine versions this repository
# restores from, and downstream surfaces may claim nothing else. That claim
# is only worth the run behind it, so the matrix is derived from the same
# manifests rather than written here: `go run ./internal/tools/versionmatrix`
# turns every verified entry into one job, and a version nobody can run is
# a version nobody can claim (docs/engine-versions.md).
#
# It runs weekly, on demand, and — through workflow_call — before every
# release tag. Third-party actions are pinned to commit SHAs (AGENTS.md
# §3.3), and no job here writes to the repository, so each checkout drops
# the token it was handed.

name: Version matrix

on:
  # Every pull request restores from adapter baselines here — this
  # workflow *is* the adapter half of the everyday gate, which is why
  # ci.yml's integration job covers only the packages outside adapters/.
  # A pull request that edits what is claimed, or the machinery that turns
  # a claim into a job, widens to the full matrix; one whose changes all
  # sit under adapter directories — bookkeeping every such change carries
  # with it aside — narrows to those adapters, and there runs every
  # version they claim rather than the baseline alone. The rule lives in
  # internal/tools/versionmatrix, where it is tested case by case.
  pull_request:
  schedule:
    # Weekly, offset from the other scheduled workflows so a slow matrix
    # never queues behind the vulnerability scan or the scorecard.
    - cron: "37 2 * * 2"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Deliberately no cancel-in-progress: a run of this workflow is the
# evidence behind a published claim, and a release gate that a scheduled
# run can cancel is not a gate.
concurrency:
  group: version-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enumerate:
    name: Enumerate claimed versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The scope decision below diffs against the pull request's base.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: decide how wide this run has to be
        id: scope
        # A schedule, a manual run, and a release tag always run
        # everything. What a pull request needs is a decision with cases —
        # widen for anything that edits a claim or the machinery behind
        # it, narrow to the adapters a change actually touches, and keep
        # every baseline whenever the answer is not obvious — so it lives
        # in the tool that already turns claims into jobs, where each case
        # has a test. Shell inside a workflow is the one place in this
        # repository no test can reach; it therefore holds no decision at
        # all beyond the event name (docs/engine-versions.md §3).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "full=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only "$BASE_SHA"...HEAD |
            go run ./internal/tools/versionmatrix -scope >> "$GITHUB_OUTPUT"
      # Narrowed to an adapter, the run takes that adapter's whole column:
      # the baseline alone cannot exercise a variant image, and a version
      # nobody ran on the pull request that wrote the code is a version
      # the pull request did not prove (docs/engine-versions.md §3).
      - name: read the versions the manifests claim
        id: list
        env:
          SCOPED_ADAPTERS: ${{ steps.scope.outputs.adapters }}
        run: |
          if [ "${{ steps.scope.outputs.full }}" = "1" ]; then
            echo "targets=$(go run ./internal/tools/versionmatrix)" >> "$GITHUB_OUTPUT"
          elif [ -n "$SCOPED_ADAPTERS" ]; then
            echo "targets=$(go run ./internal/tools/versionmatrix -adapters "$SCOPED_ADAPTERS")" >> "$GITHUB_OUTPUT"
          else
            echo "targets=$(go run ./internal/tools/versionmatrix -baselines-only)" >> "$GITHUB_OUTPUT"
          fi

  restore:
    name: ${{ matrix.target.adapter }} ${{ matrix.target.engine_version }}
    needs: enumerate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One engine version failing must not hide the others: the point of
      # this workflow is to learn which claims still hold, not to stop at
      # the first that does not.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.enumerate.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: restore from ${{ matrix.target.image }}
        # PROBAVI_IT_IMAGE overrides the manifest baseline for this job.
        # The suite refuses an image the manifest does not list, so a typo
        # here fails loudly instead of reporting a green run for a version
        # this repository never claimed.
        # The explicit -timeout makes the job's timeout-minutes above the
        # only clock: without it `go test` stops a package at its own
        # default of ten minutes, and a suite that pulls a large image
        # before its first container starts (oracle: 10 GB, measured at
        # 574 s end to end on one runner and past 600 s on the next) dies
        # at a limit no file declares. Five minutes short of the job limit
        # so the runner, not the test binary, reports the overrun.
        env:
          PROBAVI_IT_IMAGE: ${{ matrix.target.image }}
          # A library-shipped engine's versions share one base image, so
          # the image alone cannot say which artifact this job meant
          # (docs/engine-versions.md §1). The suite resolves the pair from
          # the manifest, and only for a version the manifest lists.
          PROBAVI_IT_ENGINE_VERSION: ${{ matrix.target.engine_version }}
        run: go test -race -tags integration -timeout 25m ./adapters/${{ matrix.target.adapter }}/...
