# CodeQL — GitHub's semantic code scanning, over the Go code and over the
# workflow files themselves. Findings land in the repository's Security tab.
# This is a detection surface, not one of the merge gates of AGENTS.md §3.1:
# a query added upstream must never be able to wedge the release path.
# Third-party actions are pinned to commit SHAs (supply-chain rule, §3.3).

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so queries added upstream also reach code that has not been
    # touched since the last push.
    - cron: '27 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - name: initialize
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # The repository is two modules. The autobuilder would see only the one
      # at the root, and spec/evidence — the independent verifier a third
      # party runs against a signed log — is the last component that may go
      # unexamined. Both builds run under CodeQL's tracer.
      - name: build the core
        if: matrix.language == 'go'
        run: go build ./...
      - name: build the independent verifier
        if: matrix.language == 'go'
        working-directory: spec/evidence
        run: go build ./...
      - name: analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: /language:${{ matrix.language }}
