# Example Probavi drill configuration.
# A "drill" = one scheduled restore-verification of one database, executed
# by `probavi run`. The format is specified in docs/drill-config.md and
# implemented by internal/config; this file is loaded by the config test
# suite, so it can never drift from the real schema.

target:
  name: prod-orders-db            # identifies the drill in evidence records
  adapter: postgres               # resolves to the executable probavi-adapter-postgres
  source:
    kind: pgdump                  # adapter-defined; see the adapter's probe output
    path: /backups/orders/latest.dump
    # Optional backup manifest: the JSON file the backup job wrote beside
    # the backup, stating what it produced. The core checks the artifact
    # against it before a sandbox exists, so a truncated copy or a
    # half-finished rsync fails before the restore rather than after it
    # (docs/backup-manifest.md). Write probavi-manifest/1 unless you also
    # want the baseline check below.
    # manifest: /backups/orders/latest.manifest.json
  # Optional point-in-time recovery: prove the backup restores to a chosen
  # instant, not just to its end. The source kind must declare the pitr
  # capability (e.g. the postgres adapter's pgbackrest kind). Exactly one of:
  # pitr:
  #   target_age: "24h"                      # scheduled drills: now − 24h at run time
  #   # target_time: "2026-07-30T14:32:00Z"  # or an absolute RFC 3339 instant

sandbox:
  provider: docker
  params:                         # provider-specific, passed through uninterpreted
    image: postgres:16
    memory: 2GiB
  timeout: 30m                    # hard wall-clock limit for the whole drill (required)

checks:
  - builtin: service_healthy
  - builtin: table_exists
    table: orders
  - builtin: row_count
    table: orders
    min: 100000
  - builtin: freshness            # the "is this backup actually recent?" check
    table: orders
    column: created_at
    max_age: 24h
  # Reconcile the restored rows against what the backup job counted, per
  # table, in the backup manifest's baseline (probavi-manifest/2). It takes
  # no parameters: the manifest names the tables, and one entry produces one
  # result per table. Needs the manifest above.
  # - builtin: baseline
  # Custom invariant, named for evidence records. `expect` is compared to
  # the engine CLI's textual output — prefer numeric results (count-style
  # queries), which print identically across engines; engine-typed values
  # like booleans print engine-specifically (PostgreSQL: t/f).
  - name: no-negative-totals
    sql: "SELECT count(*) FROM orders WHERE total < 0"
    expect: 0

evidence:
  path: /var/lib/probavi/evidence.jsonl
  sign_key: /etc/probavi/ed25519.key   # generate with: probavi evidence keygen

metrics:
  prometheus_textfile: /var/lib/node_exporter/probavi.prom

# Optional webhook notifications (docs/notifications.md). One JSON POST per
# webhook after the evidence record is signed; delivery failures are logged
# but never change the drill's outcome or exit code.
notify:
  webhooks:
    # Token-bearing URLs (Slack, healthchecks.io, …) are credentials: use
    # url_env so they live in the environment, never in this file.
    - url_env: PROBAVI_WEBHOOK_URL
      secret_env: PROBAVI_WEBHOOK_SECRET   # optional HMAC signing (X-Probavi-Signature-256)
      on: [fail, error]                    # default (no `on`): every outcome
    # Non-secret internal endpoints may be literal.
    - url: https://alerts.internal.example/probavi
